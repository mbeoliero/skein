name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["13", "18"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skein_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d skein_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SKEIN_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/skein_test?sslmode=disable
      SKEIN_TEST_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify database connection
        run: >-
          docker run --rm --network host postgres:${{ matrix.postgres }}-alpine
          psql "$SKEIN_TEST_DSN" -X --set=ON_ERROR_STOP=1 --command='SELECT version();'

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Lint
        run: make lint

      - name: Test with required database
        run: make test-ci

      - name: Race detector
        run: make race
